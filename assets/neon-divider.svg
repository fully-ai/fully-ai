<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 24" width="100%" height="24" role="img" aria-label="Animated neon divider">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0"/>
      <stop offset="25%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="75%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulseBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#67e8f9" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="40" y="11" width="1020" height="2" rx="1" fill="url(#divGrad)" opacity="0.65"/>
  <rect x="-180" y="10" width="180" height="4" rx="2" fill="url(#pulseBeam)">
    <animate attributeName="x" values="-180;1120" dur="3.6s" repeatCount="indefinite"/>
  </rect>
  <circle cx="550" cy="12" r="4" fill="#38bdf8">
    <animate attributeName="r" values="3;5.5;3" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" repeatCount="indefinite"/>
  </circle>
</svg>
