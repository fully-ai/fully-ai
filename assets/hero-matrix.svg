<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="100%" height="300" role="img" aria-label="fully-ai animated engineering hero banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0d1326"/>
      <stop offset="100%" stop-color="#130f2e"/>
    </linearGradient>
    <linearGradient id="neonLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.55"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="8" y="8" width="1084" height="284" rx="18"/>
    </clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="8" y="8" width="1084" height="284" rx="18" fill="url(#bgGrad)"/>
    <rect x="8" y="8" width="1084" height="284" rx="18" fill="url(#grid)"/>

    <!-- Ambient glowing orbs -->
    <circle cx="170" cy="65" r="135" fill="#0ea5e9" fill-opacity="0.11">
      <animate attributeName="r" values="125;155;125" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="910" cy="150" r="165" fill="#8b5cf6" fill-opacity="0.13">
      <animate attributeName="r" values="150;180;150" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- Animated scanning radar beam -->
    <rect x="-260" y="8" width="260" height="284" fill="url(#sweep)">
      <animate attributeName="x" values="-260;1120" dur="6.5s" repeatCount="indefinite"/>
    </rect>

    <!-- Sine pulse wave along bottom -->
    <path d="M 16 254 Q 150 226 280 254 T 550 254 T 820 254 T 1084 254" fill="none" stroke="url(#neonLine)" stroke-width="2" stroke-opacity="0.7">
      <animate attributeName="d"
        values="M 16 254 Q 150 226 280 254 T 550 254 T 820 254 T 1084 254;
                M 16 254 Q 150 278 280 254 T 550 254 T 820 254 T 1084 254;
                M 16 254 Q 150 226 280 254 T 550 254 T 820 254 T 1084 254"
        dur="5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Outer neon frame -->
  <rect x="8" y="8" width="1084" height="284" rx="18" fill="none" stroke="url(#neonLine)" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Left Hero Identity -->
  <g transform="translate(48, 46)">
    <rect x="0" y="0" width="224" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.55"/>
    <circle cx="16" cy="14" r="4.5" fill="#10b981" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="18" fill="#a5f3fc" font-size="11.5" font-weight="600" class="mono">AUTONOMOUS SYSTEMS LAB</text>

    <text x="0" y="80" fill="#f8fafc" font-size="48" font-weight="800" letter-spacing="-1" class="sans">fully-ai</text>
    <text x="198" y="80" fill="#38bdf8" font-size="46" font-weight="300" class="mono">//</text>
    <text x="256" y="78" fill="#c084fc" font-size="22" font-weight="600" class="mono">engineering.core</text>

    <text x="0" y="116" fill="#cbd5e1" font-size="15.5" class="sans">Self-hosted developer tooling, container control planes, observability &amp; local AI systems.</text>

    <!-- Stack Pills -->
    <g transform="translate(0, 144)" class="mono" font-size="12" font-weight="600">
      <rect x="0" y="0" width="66" height="28" rx="8" fill="#0f172a" stroke="#00add8" stroke-opacity="0.8"/>
      <text x="33" y="18" text-anchor="middle" fill="#67e8f9">Go</text>

      <rect x="76" y="0" width="72" height="28" rx="8" fill="#0f172a" stroke="#f97316" stroke-opacity="0.8"/>
      <text x="112" y="18" text-anchor="middle" fill="#fdba74">Rust</text>

      <rect x="158" y="0" width="78" height="28" rx="8" fill="#0f172a" stroke="#ec4899" stroke-opacity="0.8"/>
      <text x="197" y="18" text-anchor="middle" fill="#f9a8d4">C++20</text>

      <rect x="246" y="0" width="104" height="28" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-opacity="0.8"/>
      <text x="298" y="18" text-anchor="middle" fill="#93c5fd">TypeScript</text>

      <rect x="360" y="0" width="84" height="28" rx="8" fill="#0f172a" stroke="#facc15" stroke-opacity="0.8"/>
      <text x="402" y="18" text-anchor="middle" fill="#fde047">Python</text>

      <rect x="454" y="0" width="150" height="28" rx="8" fill="#0f172a" stroke="#a855f7" stroke-opacity="0.8"/>
      <text x="529" y="18" text-anchor="middle" fill="#e9d5ff">21 Public Systems</text>
    </g>
  </g>

  <!-- Right Animated Orbital Core (no overlapping windows) -->
  <g>
    <circle cx="905" cy="144" r="92" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="905" cy="144" r="92" fill="none" stroke="url(#neonLine)" stroke-width="2.5" stroke-dasharray="110 80 45 90" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 905 144" to="360 905 144" dur="14s" repeatCount="indefinite"/>
    </circle>

    <circle cx="905" cy="144" r="66" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="60 50" stroke-opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="360 905 144" to="0 905 144" dur="9s" repeatCount="indefinite"/>
    </circle>

    <circle cx="905" cy="144" r="40" fill="#0b1220" stroke="#a855f7" stroke-width="1.8" stroke-opacity="0.85"/>
    <circle cx="905" cy="144" r="46" fill="none" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.5">
      <animate attributeName="r" values="40;56;40" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>

    <!-- Orbiting Satellites -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 905 144" to="360 905 144" dur="7s" repeatCount="indefinite"/>
      <circle cx="905" cy="52" r="5" fill="#00f5d4" filter="url(#glow)"/>
      <circle cx="905" cy="236" r="4.5" fill="#c084fc" filter="url(#glow)"/>
    </g>

    <text x="905" y="140" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="800" class="mono">21</text>
    <text x="905" y="157" text-anchor="middle" fill="#67e8f9" font-size="9.5" font-weight="600" class="mono">SYSTEMS</text>
  </g>
</svg>
