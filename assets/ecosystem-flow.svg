      <rect x="0" y="141" width="222" height="40" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="157" fill="#f8fafc" font-weight="700">hookrelay</text>
      <text x="166" y="157" fill="#c084fc" font-size="10.5">v0.1.0</text>
