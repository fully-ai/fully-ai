      <rect x="0" y="188" width="222" height="40" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="204" fill="#f8fafc" font-weight="700">featuredock</text>
      <text x="166" y="204" fill="#c084fc" font-size="10.5">v0.1.0</text>
      <text x="12" y="219" fill="#94a3b8" font-size="10.5">Feature Flag &amp; Rollouts</text>

