    </circle>
    <text x="36" y="29" fill="#6ee7b7" font-size="13" font-weight="700" class="mono">SECURITY &amp; NET</text>

    <g transform="translate(16, 46)" class="mono" font-size="12">
      <rect x="0" y="0" width="222" height="56" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="22" fill="#f8fafc" font-weight="700">sentinelmesh</text>
      <text x="166" y="22" fill="#34d399" font-size="10.5">v0.1.0</text>
