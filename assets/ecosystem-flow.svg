<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 478" width="100%" height="478" role="img" aria-label="fully-ai 21-system animated ecosystem architecture map">
  <defs>
    <linearGradient id="ecoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="borderCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="borderPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="borderEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="borderAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .flow { stroke-dasharray: 7 7; animation: dashMove 1.6s linear infinite; }
      @keyframes dashMove { to { stroke-dashoffset: -28; } }
    </style>
  </defs>

  <rect x="4" y="4" width="1092" height="470" rx="18" fill="url(#ecoBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <text x="30" y="38" fill="#f8fafc" font-size="18" font-weight="700" class="sans">ECOSYSTEM TOPOLOGY</text>
  <text x="268" y="38" fill="#64748b" font-size="13" class="mono">// 5 domains · 21 modular self-hosted systems</text>

  <!-- Central Spine Connector -->
  <line x1="155" y1="256" x2="945" y2="256" stroke="#334155" stroke-width="2"/>
  <line x1="155" y1="256" x2="945" y2="256" stroke="#38bdf8" stroke-width="2" class="flow"/>

  <!-- Signal Pulses moving across spine -->
  <circle r="5" fill="#00f5d4" filter="url(#softGlow)">
    <animateMotion dur="3.4s" repeatCount="indefinite" path="M 155 256 L 945 256"/>
  </circle>
  <circle r="4.5" fill="#c084fc" filter="url(#softGlow)">
    <animateMotion dur="3.4s" begin="1.7s" repeatCount="indefinite" path="M 945 256 L 155 256"/>
  </circle>

  <!-- Vertical Connectors to 4 Domain Columns -->
  <path d="M 155 180 L 155 330" stroke="#06b6d4" stroke-width="1.8" class="flow"/>
  <path d="M 418 180 L 418 330" stroke="#8b5cf6" stroke-width="1.8" class="flow"/>
  <path d="M 682 180 L 682 330" stroke="#10b981" stroke-width="1.8" class="flow"/>
  <path d="M 945 180 L 945 330" stroke="#f59e0b" stroke-width="1.8" class="flow"/>

  <!-- Column 1: Infrastructure & Runtime -->
  <g transform="translate(28, 62)">
    <rect x="0" y="0" width="254" height="388" rx="14" fill="#0b1220" stroke="url(#borderCyan)" stroke-width="1.5"/>
    <circle cx="22" cy="24" r="5" fill="#06b6d4" filter="url(#softGlow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="36" y="29" fill="#67e8f9" font-size="13" font-weight="700" class="mono">INFRA &amp; RUNTIME</text>

    <g transform="translate(16, 46)" class="mono" font-size="12">
      <rect x="0" y="0" width="222" height="47" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="19" fill="#f8fafc" font-weight="700">helixcloud</text>
      <text x="166" y="19" fill="#22d3ee" font-size="10.5">v0.1.0</text>
      <text x="12" y="36" fill="#94a3b8" font-size="10.5">Container Orchestrator</text>

      <rect x="0" y="55" width="222" height="47" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="74" fill="#f8fafc" font-weight="700">dockyard</text>
      <text x="166" y="74" fill="#22d3ee" font-size="10.5">v0.1.0</text>
      <text x="12" y="91" fill="#94a3b8" font-size="10.5">Docker &amp; Compose UI</text>

      <rect x="0" y="110" width="222" height="47" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="129" fill="#f8fafc" font-weight="700">statusgrid</text>
      <text x="166" y="129" fill="#22d3ee" font-size="10.5">v0.1.0</text>
      <text x="12" y="146" fill="#94a3b8" font-size="10.5">Uptime &amp; Incident Grid</text>

      <rect x="0" y="165" width="222" height="47" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="184" fill="#f8fafc" font-weight="700">syncforge</text>
      <text x="166" y="184" fill="#22d3ee" font-size="10.5">v0.1.0</text>
      <text x="12" y="201" fill="#94a3b8" font-size="10.5">Encrypted Snapshot Sync</text>

      <rect x="0" y="220" width="222" height="47" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="239" fill="#f8fafc" font-weight="700">hostwatch</text>
      <text x="166" y="239" fill="#34d399" font-size="10.5">v0.3.0</text>
      <text x="12" y="256" fill="#94a3b8" font-size="10.5">Telemetry &amp; Alerting</text>

      <rect x="0" y="275" width="222" height="47" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="294" fill="#f8fafc" font-weight="700">logsentry</text>
      <text x="166" y="294" fill="#94a3b8" font-size="10.5">v0.2.0</text>
      <text x="12" y="311" fill="#94a3b8" font-size="10.5">Structured Log Search</text>
