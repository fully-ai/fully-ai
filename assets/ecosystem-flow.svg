    <text x="36" y="29" fill="#e9d5ff" font-size="13" font-weight="700" class="mono">PLATFORMS &amp; DATA</text>

    <g transform="translate(16, 46)" class="mono" font-size="12">
      <rect x="0" y="0" width="222" height="40" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="16" fill="#f8fafc" font-weight="700">titandb</text>
      <text x="166" y="16" fill="#c084fc" font-size="10.5">v0.1.0</text>
      <text x="12" y="31" fill="#94a3b8" font-size="10.5">Distributed Raft SQL DB</text>

      <rect x="0" y="47" width="222" height="40" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="63" fill="#f8fafc" font-weight="700">streamforge</text>
      <text x="166" y="63" fill="#c084fc" font-size="10.5">v0.1.0</text>
