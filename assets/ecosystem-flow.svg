    <text x="36" y="29" fill="#fde68a" font-size="13" font-weight="700" class="mono">AI &amp; 3D SYSTEMS</text>

    <g transform="translate(16, 46)" class="mono" font-size="12">
      <rect x="0" y="0" width="222" height="71" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="22" fill="#f8fafc" font-weight="700">localai-studio</text>
      <text x="166" y="22" fill="#94a3b8" font-size="10.5">v0.2.0</text>
      <text x="12" y="41" fill="#94a3b8" font-size="10.5">Local LLM Workspace</text>
      <text x="12" y="57" fill="#64748b" font-size="10">Prompt Eval &amp; Streaming</text>

      <rect x="0" y="83" width="222" height="71" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="105" fill="#f8fafc" font-weight="700">documind</text>
      <text x="166" y="105" fill="#34d399" font-size="10.5">v0.3.0</text>
      <text x="12" y="124" fill="#94a3b8" font-size="10.5">Hybrid BM25 + Vector</text>
      <text x="12" y="140" fill="#64748b" font-size="10">RRF Search &amp; Citations</text>

      <rect x="0" y="166" width="222" height="71" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="188" fill="#f8fafc" font-weight="700">astra-engine</text>
      <text x="166" y="188" fill="#fbbf24" font-size="10.5">v0.1.0</text>
      <text x="12" y="207" fill="#94a3b8" font-size="10.5">C++20 / OpenGL 3.3 3D</text>
      <text x="12" y="223" fill="#64748b" font-size="10">ECS, PBR, Physics &amp; VM</text>

      <rect x="0" y="249" width="222" height="73" rx="8" fill="#111827" stroke="#f59e0b" stroke-opacity="0.4" stroke-dasharray="4 4"/>
      <text x="111" y="280" text-anchor="middle" fill="#fbbf24" font-size="11.5" font-weight="700">CI/CD VERIFIED</text>
      <text x="111" y="300" text-anchor="middle" fill="#94a3b8" font-size="10.5">21 Self-Hosted Systems</text>
