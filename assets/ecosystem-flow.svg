    <rect x="0" y="0" width="254" height="388" rx="14" fill="#0b1220" stroke="url(#borderAmber)" stroke-width="1.5"/>
    <circle cx="22" cy="24" r="5" fill="#f59e0b" filter="url(#softGlow)">
