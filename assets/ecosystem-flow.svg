      <rect x="0" y="66" width="222" height="56" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="88" fill="#f8fafc" font-weight="700">devguard</text>
      <text x="166" y="88" fill="#34d399" font-size="10.5">v0.3.0</text>
      <text x="12" y="106" fill="#94a3b8" font-size="10.5">SAST, Secrets &amp; SARIF</text>

      <rect x="0" y="132" width="222" height="56" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="154" fill="#f8fafc" font-weight="700">vaultdrop</text>
      <text x="166" y="154" fill="#94a3b8" font-size="10.5">v0.2.0</text>
      <text x="12" y="172" fill="#94a3b8" font-size="10.5">E2E Encrypted Drops</text>

      <rect x="0" y="198" width="222" height="56" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="220" fill="#f8fafc" font-weight="700">netscope</text>
      <text x="166" y="220" fill="#94a3b8" font-size="10.5">v0.2.0</text>
      <text x="12" y="238" fill="#94a3b8" font-size="10.5">Port, DNS &amp; TLS Probes</text>

      <rect x="0" y="264" width="222" height="56" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="286" fill="#f8fafc" font-weight="700">proxylab</text>
      <text x="166" y="286" fill="#94a3b8" font-size="10.5">v0.2.0</text>
      <text x="12" y="304" fill="#94a3b8" font-size="10.5">HTTP Traffic Inspector</text>
