<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" width="100%" height="410" role="img" aria-label="fully-ai 16-system animated ecosystem architecture map">
  <defs>
    <linearGradient id="ecoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="borderCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="borderPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="borderEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="borderAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .flow { stroke-dasharray: 7 7; animation: dashMove 1.6s linear infinite; }
      @keyframes dashMove { to { stroke-dashoffset: -28; } }
    </style>
  </defs>

  <rect x="4" y="4" width="1092" height="402" rx="18" fill="url(#ecoBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <text x="30" y="38" fill="#f8fafc" font-size="18" font-weight="700" class="sans">ECOSYSTEM TOPOLOGY</text>
  <text x="236" y="38" fill="#64748b" font-size="13" class="mono">// 4 domains · 16 modular self-hosted systems</text>

  <!-- Central Spine Connector -->
  <line x1="155" y1="205" x2="945" y2="205" stroke="#334155" stroke-width="2"/>
  <line x1="155" y1="205" x2="945" y2="205" stroke="#38bdf8" stroke-width="2" class="flow"/>

  <!-- Signal Pulses moving across spine -->
  <circle r="5" fill="#00f5d4" filter="url(#softGlow)">
    <animateMotion dur="3.4s" repeatCount="indefinite" path="M 155 205 L 945 205"/>
  </circle>
  <circle r="4.5" fill="#c084fc" filter="url(#softGlow)">
    <animateMotion dur="3.4s" begin="1.7s" repeatCount="indefinite" path="M 945 205 L 155 205"/>
  </circle>

  <!-- Vertical Connectors to 4 Domain Columns -->
  <path d="M 155 150 L 155 260" stroke="#06b6d4" stroke-width="1.8" class="flow"/>
  <path d="M 418 150 L 418 260" stroke="#8b5cf6" stroke-width="1.8" class="flow"/>
  <path d="M 682 150 L 682 260" stroke="#10b981" stroke-width="1.8" class="flow"/>
  <path d="M 945 150 L 945 260" stroke="#f59e0b" stroke-width="1.8" class="flow"/>

  <!-- Column 1: Infrastructure & Runtime -->
  <g transform="translate(28, 62)">
    <rect x="0" y="0" width="254" height="320" rx="14" fill="#0b1220" stroke="url(#borderCyan)" stroke-width="1.5"/>
    <circle cx="22" cy="24" r="5" fill="#06b6d4" filter="url(#softGlow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="36" y="29" fill="#67e8f9" font-size="13" font-weight="700" class="mono">INFRA &amp; RUNTIME</text>

    <g transform="translate(16, 48)" class="mono" font-size="12">
      <rect x="0" y="0" width="222" height="44" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="19" fill="#f8fafc" font-weight="700">dockyard</text>
      <text x="166" y="19" fill="#22d3ee" font-size="10.5">v0.1.0</text>
      <text x="12" y="35" fill="#94a3b8" font-size="10.5">Docker &amp; Compose UI</text>

      <rect x="0" y="54" width="222" height="44" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="73" fill="#f8fafc" font-weight="700">statusgrid</text>
      <text x="166" y="73" fill="#22d3ee" font-size="10.5">v0.1.0</text>
      <text x="12" y="89" fill="#94a3b8" font-size="10.5">Uptime &amp; Incident Grid</text>

      <rect x="0" y="108" width="222" height="44" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="127" fill="#f8fafc" font-weight="700">syncforge</text>
      <text x="166" y="127" fill="#22d3ee" font-size="10.5">v0.1.0</text>
      <text x="12" y="143" fill="#94a3b8" font-size="10.5">Encrypted Snapshot Sync</text>

      <rect x="0" y="162" width="222" height="44" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="181" fill="#f8fafc" font-weight="700">hostwatch</text>
      <text x="166" y="181" fill="#34d399" font-size="10.5">v0.3.0</text>
      <text x="12" y="197" fill="#94a3b8" font-size="10.5">Telemetry &amp; Alerting</text>

      <rect x="0" y="216" width="222" height="44" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="235" fill="#f8fafc" font-weight="700">logsentry</text>
      <text x="166" y="235" fill="#94a3b8" font-size="10.5">v0.2.0</text>
      <text x="12" y="251" fill="#94a3b8" font-size="10.5">Structured Log Search</text>
    </g>
  </g>

  <!-- Column 2: Developer Platforms & Data -->
  <g transform="translate(291, 62)">
    <rect x="0" y="0" width="254" height="320" rx="14" fill="#0b1220" stroke="url(#borderPurple)" stroke-width="1.5"/>
    <circle cx="22" cy="24" r="5" fill="#a855f7" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="36" y="29" fill="#e9d5ff" font-size="13" font-weight="700" class="mono">PLATFORMS &amp; DATA</text>

    <g transform="translate(16, 48)" class="mono" font-size="12">
      <rect x="0" y="0" width="222" height="44" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="19" fill="#f8fafc" font-weight="700">querypilot</text>
      <text x="166" y="19" fill="#c084fc" font-size="10.5">v0.1.0</text>
      <text x="12" y="35" fill="#94a3b8" font-size="10.5">Multi-Engine SQL Studio</text>

      <rect x="0" y="54" width="222" height="44" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="73" fill="#f8fafc" font-weight="700">hookrelay</text>
      <text x="166" y="73" fill="#c084fc" font-size="10.5">v0.1.0</text>
      <text x="12" y="89" fill="#94a3b8" font-size="10.5">Webhook Relay &amp; Replay</text>

      <rect x="0" y="108" width="222" height="44" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="127" fill="#f8fafc" font-weight="700">featuredock</text>
      <text x="166" y="127" fill="#c084fc" font-size="10.5">v0.1.0</text>
      <text x="12" y="143" fill="#94a3b8" font-size="10.5">Feature Flag &amp; Rollouts</text>

      <rect x="0" y="162" width="222" height="44" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="181" fill="#f8fafc" font-weight="700">taskforge</text>
      <text x="166" y="181" fill="#34d399" font-size="10.5">v0.3.0</text>
      <text x="12" y="197" fill="#94a3b8" font-size="10.5">DAG Queue &amp; Scheduler</text>

      <rect x="0" y="216" width="222" height="44" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="235" fill="#f8fafc" font-weight="700">koral-chat</text>
      <text x="166" y="235" fill="#94a3b8" font-size="10.5">v0.2.0</text>
      <text x="12" y="251" fill="#94a3b8" font-size="10.5">Realtime Team Messaging</text>
    </g>
  </g>

  <!-- Column 3: Security & Networking -->
  <g transform="translate(555, 62)">
    <rect x="0" y="0" width="254" height="320" rx="14" fill="#0b1220" stroke="url(#borderEmerald)" stroke-width="1.5"/>
    <circle cx="22" cy="24" r="5" fill="#10b981" filter="url(#softGlow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.9s" repeatCount="indefinite"/>
    </circle>
    <text x="36" y="29" fill="#6ee7b7" font-size="13" font-weight="700" class="mono">SECURITY &amp; NET</text>

    <g transform="translate(16, 48)" class="mono" font-size="12">
      <rect x="0" y="0" width="222" height="56" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="22" fill="#f8fafc" font-weight="700">devguard</text>
      <text x="166" y="22" fill="#34d399" font-size="10.5">v0.3.0</text>
      <text x="12" y="40" fill="#94a3b8" font-size="10.5">SAST, Secrets &amp; SARIF</text>

      <rect x="0" y="68" width="222" height="56" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="90" fill="#f8fafc" font-weight="700">vaultdrop</text>
      <text x="166" y="90" fill="#94a3b8" font-size="10.5">v0.2.0</text>
      <text x="12" y="108" fill="#94a3b8" font-size="10.5">E2E Encrypted Drops</text>

      <rect x="0" y="136" width="222" height="56" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="158" fill="#f8fafc" font-weight="700">netscope</text>
      <text x="166" y="158" fill="#94a3b8" font-size="10.5">v0.2.0</text>
      <text x="12" y="176" fill="#94a3b8" font-size="10.5">Port, DNS &amp; TLS Probes</text>

      <rect x="0" y="204" width="222" height="56" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="226" fill="#f8fafc" font-weight="700">proxylab</text>
      <text x="166" y="226" fill="#94a3b8" font-size="10.5">v0.2.0</text>
      <text x="12" y="244" fill="#94a3b8" font-size="10.5">HTTP Traffic Inspector</text>
    </g>
  </g>

  <!-- Column 4: AI & Knowledge -->
  <g transform="translate(818, 62)">
    <rect x="0" y="0" width="254" height="320" rx="14" fill="#0b1220" stroke="url(#borderAmber)" stroke-width="1.5"/>
    <circle cx="22" cy="24" r="5" fill="#f59e0b" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="36" y="29" fill="#fde68a" font-size="13" font-weight="700" class="mono">AI &amp; KNOWLEDGE</text>

    <g transform="translate(16, 48)" class="mono" font-size="12">
      <rect x="0" y="0" width="222" height="82" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="26" fill="#f8fafc" font-weight="700">localai-studio</text>
      <text x="166" y="26" fill="#94a3b8" font-size="10.5">v0.2.0</text>
      <text x="12" y="47" fill="#94a3b8" font-size="10.5">Local LLM Workspace</text>
      <text x="12" y="65" fill="#64748b" font-size="10">Prompt Eval &amp; Streaming</text>

      <rect x="0" y="96" width="222" height="82" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="122" fill="#f8fafc" font-weight="700">documind</text>
      <text x="166" y="122" fill="#34d399" font-size="10.5">v0.3.0</text>
      <text x="12" y="143" fill="#94a3b8" font-size="10.5">Hybrid BM25 + Vector</text>
      <text x="12" y="161" fill="#64748b" font-size="10">RRF Search &amp; Citations</text>

      <rect x="0" y="192" width="222" height="68" rx="8" fill="#111827" stroke="#f59e0b" stroke-opacity="0.4" stroke-dasharray="4 4"/>
      <text x="111" y="220" text-anchor="middle" fill="#fbbf24" font-size="11.5" font-weight="700">CI/CD VERIFIED</text>
      <text x="111" y="240" text-anchor="middle" fill="#94a3b8" font-size="10.5">Zero-Cost Self-Hosted</text>
    </g>
  </g>
</svg>
